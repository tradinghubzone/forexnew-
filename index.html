<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MORGAN v19.1 VOICE AI - BEST</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060a14;color:#fff;font-family:Arial;padding:12px;overflow-x:hidden}
.box{max-width:560px;margin:0 auto}
.card{background:linear-gradient(145deg,#151a33,#0e1230);border:2px solid #00e67666;border-radius:20px;padding:16px;margin:14px 0;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,#00e676,transparent);animation:scan 2.5s linear infinite}
@keyframes scan{0%{left:-100%}100%{left:100%}}
.robotHead{width:95px;height:95px;margin:0 auto;background:#111734;border:3px solid #00e676;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 30px #00e67666;animation:float 3s ease-in-out infinite;cursor:pointer}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.eye{width:18px;height:18px;background:#00e676;border-radius:50%;margin:0 8px;box-shadow:0 0 15px #00e676;animation:blink 4s infinite}
@keyframes blink{0%,96%,100%{height:18px}97%,99%{height:2px}}
.mouth{position:absolute;bottom:18px;width:28px;height:4px;background:#00e676;border-radius:10px;animation:talk 0.4s infinite alternate}
@keyframes talk{0%{width:18px;height:3px}100%{width:32px;height:5px}}
.badge{padding:5px 12px;border-radius:20px;font-size:10px;font-weight:900}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #00e67688}50%{box-shadow:0 0 0 10px #00e67600}}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:900;margin-top:10px;cursor:pointer}
.btn-live{background:linear-gradient(90deg,#00e676,#00ff88);color:#000;box-shadow:0 4px 20px #00e67655}
.sigGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sigItem{background:#000000cc;border:1px solid #222;border-radius:10px;padding:10px;text-align:center}
.countdown{font-family:'Orbitron';font-size:28px;font-weight:900;color:#ffcc00}
.speakBtn{background:#222;border:1px solid #00e676;color:#00e676;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:900;cursor:pointer;margin-top:8px}
.speaking{animation:speakGlow 0.5s infinite alternate}
@keyframes speakGlow{0%{box-shadow:0 0 10px #00e676}100%{box-shadow:0 0 25px #00ff88,0 0 40px #00e676}}
</style></head><body>
<div class="box">

<div class="card" style="text-align:center;border-color:#00e676">
<div class="robotHead pulse" id="robot" onclick="speakNow()"><div class="eye"></div><div class="eye"></div><div class="mouth"></div></div>
<div style="font-family:'Orbitron';font-weight:900;font-size:22px;margin-top:12px">MORGAN • AI v19.1 VOICE</div>
<div style="color:#00e676;font-weight:900;font-size:12px">🔊 SPEAKING • INTELLIGENT • TAP ROBOT TO HEAR</div>
<div style="font-size:10px;color:#8aa0be">NFP • CPI • FOMC • PPI + Entry/SL/TP + Voice Alert</div>
<button class="speakBtn" onclick="speakNow()">🔊 TAP TO HEAR: "CPI in 4 days, get ready!"</button>
<div id="status" style="margin-top:12px"></div>
</div>

<div class="card" id="main" style="border-color:#ffcc00"></div>

<div class="card">
<div style="font-weight:900;font-family:'Orbitron';font-size:13px">📅 NEWS INTELLIGENCE CALENDAR - VOICE ENABLED</div>
<div id="calendar"></div>
</div>

<div class="card" style="text-align:center;border-color:#25D366">
<div style="font-weight:900">M-PESA 0116162159</div>
<div style="font-size:11px">KES 500 - Only Robot in Kenya That Speaks!</div>
<button class="btn" style="background:#25D366;color:#fff" onclick="window.open('https://wa.me/254116162159?text=Hi Morgan VOICE robot v19.1')">WhatsApp 0116162159</button>
</div>

</div>
<script>
const newsDB=[
{type:'CPI',date:'2026-10-14',time:'15:30',pair:'XAUUSD',forecast:'3.2%',prev:'3.3%',base:2042.5,desc:'If Actual > 3.3% = STRONG USD, SELL Gold. If < 3.0% = WEAK USD, BUY Gold'},
{type:'FOMC',date:'2026-10-28',time:'21:00',pair:'EURUSD',forecast:'5.00%',prev:'5.00%',base:1.0840,desc:'Hawkish +0.25% = USD +120 pips'},
{type:'NFP',date:'2026-11-07',time:'15:30',pair:'GBPUSD',forecast:'190K',prev:'180K',base:1.3045,desc:'NFP > 220K = BUY USD. <150K = SELL USD'},
{type:'PPI',date:'2026-11-12',time:'15:30',pair:'XAUUSD',forecast:'0.2%',prev:'0.3%',base:2065,desc:'PPI high = USD up, Gold down'},
];

let voiceEnabled=true;
function speakNow(){
 let today=new Date().toISOString().split('T')[0];
 let next=newsDB.filter(n=>n.date>=today)[0];
 let days=next?Math.ceil((new Date(next.date)-new Date(today))/86400000):0;
 let msg='';
 if(next){
   if(days==0) msg=`Attention! Today is ${next.type} day! ${next.pair} intelligent signal is ready. Entry ${next.base}. Get ready to trade!`;
   else if(days==1) msg=`Morgan AI here. ${next.type} news is tomorrow! Forecast ${next.forecast}. Prepare your ${next.pair} entry.`;
   else msg=`Hello! Morgan intelligent robot speaking. ${next.type} news in ${days} days, on ${next.date}. Get ready! Forecast ${next.forecast}. Entry around ${next.base}. This robot is the best in Kenya!`;
 } else {
   msg='Morgan AI robot online. No news today. I am learning to be more intelligent.';
 }
 document.getElementById('robot').classList.add('speaking');
 let utter=new SpeechSynthesisUtterance(msg);
 utter.rate=0.95; utter.pitch=0.9; utter.volume=1;
 utter.onend=()=>{document.getElementById('robot').classList.remove('speaking');};
 speechSynthesis.cancel();
 speechSynthesis.speak(utter);
}

function getSig(n){
 let buy=Math.random()>0.5;
 let dir=buy?'BUY':'SELL';
 let e=n.base;
 let sl=dir=='BUY'?e-(n.pair=='XAUUSD'?8:0.003):e+(n.pair=='XAUUSD'?8:0.003);
 let tp1=dir=='BUY'?e+(n.pair=='XAUUSD'?17:0.006):e-(n.pair=='XAUUSD'?17:0.006);
 let tp2=dir=='BUY'?e+(n.pair=='XAUUSD'?30:0.01):e-(n.pair=='XAUUSD'?30:0.01);
 return{dir,entry:e.toFixed(2),sl:sl.toFixed(2),tp1:tp1.toFixed(2),tp2:tp2.toFixed(2),conf:87+Math.floor(Math.random()*10)};
}

function init(){
 let today=new Date().toISOString().split('T')[0];
 let todayNews=newsDB.find(n=>n.date===today);
 let upcoming=newsDB.filter(n=>n.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
 let next=upcoming[0];
 let days=next?Math.ceil((new Date(next.date)-new Date(today))/86400000):0;

 let statusEl=document.getElementById('status');
 let mainEl=document.getElementById('main');

 if(todayNews){
   let s=getSig(todayNews);
   statusEl.innerHTML=`<span class="badge pulse" style="background:#ff3344;color:#fff">🔴 LIVE NOW - ${todayNews.type} - VOICE ALERT ON</span><div class="countdown">TAP ROBOT TO HEAR SIGNAL!</div><button class="speakBtn" onclick="speakNow()">🔊 HEAR LIVE ${todayNews.type} ENTRY NOW</button>`;
   mainEl.style.borderColor='#00e676';
   mainEl.innerHTML=`
   <div style="font-weight:900;display:flex;justify-content:space-between"><span>🤖 ${todayNews.type} VOICE SIGNAL</span><span class="badge" style="background:#00e676;color:#000">${s.conf}% AI</span></div>
   <div style="font-size:11px;color:#8aa0be;margin-top:6px">${todayNews.date} ${todayNews.time} EAT • Forecast ${todayNews.forecast} • ${todayNews.desc}</div>
   <div style="background:#000;border-radius:14px;padding:14px;margin-top:12px">
     <div style="display:flex;justify-content:space-between"><b style="font-size:18px">${todayNews.pair}</b><span class="badge" style="background:${s.dir=='BUY'?'#00e676':'#ff3344'};font-size:13px;padding:8px 16px">${s.dir}</span></div>
     <div class="sigGrid">
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">ENTRY</div><div style="font-size:16px;font-weight:900;color:#ffcc00">${s.entry}</div></div>
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">SL</div><div style="font-size:16px;font-weight:900;color:#ff3344">${s.sl}</div></div>
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">TP1</div><div style="font-size:16px;font-weight:900;color:#00e676">${s.tp1}</div></div>
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">TP2</div><div style="font-size:16px;font-weight:900;color:#00e676">${s.tp2}</div></div>
     </div>
   </div>
   <button class="btn btn-live" onclick="speakNow()">🔊 GENERATE & SPEAK ENTRY NOW</button>
   `;
   setTimeout(()=>{speakNow();},2000);
 } else {
   statusEl.innerHTML=`<span class="badge" style="background:#222;color:#8aa0be">💤 SLEEPING - ${days} DAYS TO NEXT</span><div class="countdown">${days} DAYS</div><button class="speakBtn" onclick="speakNow()">🔊 TAP ROBOT - HEAR NEXT NEWS</button>`;
   mainEl.innerHTML=`
   <div style="font-weight:900">💤 ROBOT SLEEPING - TAP TO HEAR WHEN NEXT</div>
   <div style="font-size:11px;color:#8aa0be;margin-top:6px">Today ${today} no news. Tap robot head, it will tell you next news in voice!</div>
   <div style="background:#000;border-radius:14px;padding:14px;margin-top:12px;text-align:center">
     <div style="font-size:10px;color:#5a6f8e">NEXT VOICE ALERT IN</div>
     <div style="font-size:26px;font-weight:900;color:#ffcc00">${days} DAYS</div>
     <div style="font-size:14px;font-weight:900;color:#00e676">${next?next.type+' - '+next.date:''}</div>
     <div style="font-size:11px;color:#ffcc00;margin-top:6px">${next?next.pair+' Entry ~'+next.base:''}</div>
   </div>
   `;
   setTimeout(()=>{if('speechSynthesis' in window) speakNow();},3000);
 }

 let cal='';
 upcoming.slice(0,4).forEach((n,i)=>{
   let s=getSig(n);
   cal+=`<div style="background:${n.type=='NFP'?'#1a0f0f':n.type=='CPI'?'#1f1a0a':'#0a1a2f'};border-left:4px solid ${n.type=='NFP'?'#ff3344':n.type=='CPI'?'#ffcc00':'#00aaff'};padding:12px;border-radius:12px;margin-top:8px;${i==0?'border:2px solid #00e676':''}">
   <div style="display:flex;justify-content:space-between"><div><b>${n.type} • ${n.date}</b> ${i==0?'<span class="badge" style="background:#00e676;color:#000">NEXT - TAP TO HEAR</span>':''}<br><small style="color:#8aa0be">${n.time} EAT • ${n.pair} • Forecast ${n.forecast} • Entry ~${n.base}</small><br><small style="color:#5a6f8e;font-size:10px">${n.desc}</small></div><div><span class="badge" style="background:${s.dir=='BUY'?'#00e676':'#ff3344'}">${s.dir}</span><br><small style="font-size:9px;color:#ffcc00">${i==0?days+'d':''}</small><br><button class="speakBtn" style="padding:4px 8px;margin-top:4px" onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('${n.type} on ${n.date}, ${n.pair} entry ${n.base}. ${n.desc}'))">🔊</button></div></div></div>`;
 });
 document.getElementById('calendar').innerHTML=cal;
}
init();
</script>
</body></html>
